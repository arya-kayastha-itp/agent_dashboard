name: CI

# Every push: unit tests, lint, frontend build, Docker image build. Nothing
# here talks to Databricks, so the repo holds no secrets. The integration
# suites (npm run test:integration) are run locally against the test schema
# before each deploy — see README "Tests".
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Unit tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backend unit tests
        run: npm test --workspace backend
      - name: Frontend lint
        run: npm run lint --workspace frontend
      - name: Frontend build
        run: npm run build --workspace frontend
      - name: Docker image builds
        run: docker build --tag agent-dashboard:ci .
